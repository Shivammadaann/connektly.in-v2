<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Messenger Integration | Connektly</title>
  <meta name="description" content="Scale lead generation on Facebook with AI agents using Connektly." />
  <link rel="icon" type="image/png" href="../../connektly-favicon.png" />
  <link rel="apple-touch-icon" href="../../connektly-favicon.png" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #13241d;
      --site-header-shell-height: 4.15rem;
      --header-float-offset: 0.65rem;
      --max-width: clamp(1320px, 88vw, 1640px);
    }
    
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: "Manrope", "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      /* Pastel background matching reference */
      background: 
        radial-gradient(circle at 15% 50%, rgba(200, 230, 255, 0.6), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(255, 230, 200, 0.5), transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(220, 255, 230, 0.4), transparent 40%),
        #f4f8fc;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    img {
      display: block;
      max-width: 100%;
    }
    
    a {
      color: inherit;
      text-decoration: none;
    }
    
    /* Header Placeholder logic for global.js */
    [data-site-header] {
      display: block;
      min-height: calc(var(--site-header-shell-height) + 0.25rem);
    }
    
    [data-site-header] {
      display: block;
      min-height: calc(var(--site-header-shell-height) + 0.25rem);
    }

    .site-header {
      position: fixed;
      top: var(--header-float-offset);
      left: 50%;
      z-index: 35;
      width: min(calc(100% - clamp(1rem, 3vw, 3rem)), min(var(--max-width), 1480px));
      margin: 0;
      padding: 0.52rem 0.62rem 0.52rem 0.72rem;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.55rem, 1.4vw, 1.1rem);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(10, 18, 32, 0.84);
      color: #ffffff;
      box-shadow:
        0 18px 50px rgba(8, 13, 24, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform: translateX(-50%);
      transition:
        top 280ms ease,
        width 280ms ease,
        padding 280ms ease,
        background 280ms ease,
        border-color 280ms ease,
        box-shadow 280ms ease,
        transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
      animation: headerDropDesktop 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .site-header.is-scrolled {
      top: 0.45rem;
      width: min(calc(100% - clamp(1.25rem, 4vw, 4rem)), min(var(--max-width), 1380px));
      padding-block: 0.42rem;
      background: rgba(8, 13, 24, 0.92);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow:
        0 16px 44px rgba(8, 13, 24, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .site-header.is-hidden:not(.is-open) {
      transform: translateX(-50%) translateY(calc(-100% - 1.2rem));
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.62rem;
      min-width: 0;
      justify-self: start;
      transition: transform 220ms ease;
    }

    .brand:hover {
      transform: translateY(-1px);
    }

    .brand__mark {
      width: 2.35rem;
      height: 2.35rem;
      display: grid;
      place-items: center;
      border-radius: 0.82rem;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
      transition: transform 260ms ease;
    }

    .brand:hover .brand__mark {
      transform: rotate(-2deg) scale(1.03);
    }

    .brand__mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand__text strong {
      font-family: "Sora", "Manrope", sans-serif;
      font-size: 0.94rem;
      color: #ffffff;
      letter-spacing: 0;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-self: center;
      gap: 0.2rem;
      padding: 0.18rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
    }

    .site-nav>a:not(.button),
    .nav-dropdown__toggle {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      min-height: 2.25rem;
      padding: 0.55rem 0.72rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1;
      transition: color 200ms ease, background 200ms ease, transform 200ms ease;
    }

    .site-nav>a:not(.button)::before,
    .nav-dropdown__toggle::before {
      content: "";
      position: absolute;
      inset: 0.22rem;
      z-index: -1;
      border-radius: inherit;
      background: rgba(37, 218, 123, 0.13);
      border: 1px solid rgba(37, 218, 123, 0.1);
      opacity: 0;
      transform: scale(0.82);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .site-nav>a:not(.button):hover,
    .site-nav>a:not(.button).is-active,
    .nav-dropdown__toggle:hover,
    .nav-dropdown[open]>.nav-dropdown__toggle,
    .nav-dropdown--current>.nav-dropdown__toggle {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    .site-nav>a:not(.button).is-active,
    .nav-dropdown--current>.nav-dropdown__toggle {
      color: #27e681;
    }

    .site-nav>a:not(.button):hover::before,
    .site-nav>a:not(.button).is-active::before,
    .nav-dropdown__toggle:hover::before,
    .nav-dropdown[open]>.nav-dropdown__toggle::before,
    .nav-dropdown--current>.nav-dropdown__toggle::before {
      opacity: 1;
      transform: scale(1);
    }

    .nav-dropdown {
      position: relative;
    }

    .nav-dropdown__toggle {
      gap: 0.55rem;
    }

    .nav-dropdown__toggle::after {
      content: "";
      width: 0.4rem;
      height: 0.4rem;
      border-right: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      opacity: 0.82;
      transform: rotate(45deg) translateY(-1px);
      transition: transform 220ms ease, opacity 220ms ease;
    }

    .nav-dropdown:hover>.nav-dropdown__toggle::after,
    .nav-dropdown[open]>.nav-dropdown__toggle::after {
      transform: rotate(225deg) translate(-1px, -1px);
      opacity: 1;
    }

    .nav-dropdown__menu {
      position: absolute;
      top: calc(100% + 0.72rem);
      left: 50%;
      z-index: 40;
      display: block;
      min-width: 260px;
      max-width: 300px;
      padding: 0.55rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.1rem;
      background: rgba(8, 15, 26, 0.94);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(0.8rem) scale(0.97);
      transition:
        opacity 220ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
        visibility 220ms;
    }

    .nav-dropdown__menu::before {
      content: "";
      position: absolute;
      top: -1rem;
      left: 0;
      right: 0;
      height: 1rem;
    }

    .nav-dropdown:hover .nav-dropdown__menu,
    .nav-dropdown[open] .nav-dropdown__menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .nav-dropdown__menu--lg {
      min-width: 340px;
      max-width: 380px;
    }

    .nav-dropdown__menu-inner {
      display: grid;
      gap: 0.25rem;
    }

    .nav-dropdown__menu a {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
      padding: 0.72rem 0.82rem;
      border-radius: 0.78rem;
      transition: background 180ms ease, transform 180ms ease;
    }

    .nav-dropdown__menu a:hover,
    .nav-dropdown__menu a.is-active {
      background: rgba(255, 255, 255, 0.075);
      transform: translateX(3px);
    }

    .dropdown-item-label {
      color: #e2e8f0;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .dropdown-item-desc {
      color: #94a3b8;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.62rem;
    }

    .header-actions .nav-login,
    .mobile-actions .nav-login {
      padding: 0.58rem 0.62rem;
      border-radius: 999px;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .header-actions .nav-login:hover,
    .mobile-actions .nav-login:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #27e681;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.85rem;
      padding: 0.68rem 1.1rem;
      border: 1px solid transparent;
      border-radius: 999px;
      background: #25da7b;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      line-height: 1;
      letter-spacing: 0;
      box-shadow: 0 10px 24px rgba(24, 191, 99, 0.16);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(24, 191, 99, 0.26);
    }

    .button--sm {
      min-height: 2.55rem;
      padding-inline: 1rem;
      font-size: 0.88rem;
      background: linear-gradient(135deg, #22dd7a, #14c76d);
      box-shadow: 0 10px 22px rgba(20, 199, 109, 0.22);
    }

    .mobile-actions,
    .nav-toggle {
      display: none;
    }

    .nav-toggle {
      width: 2.7rem;
      height: 2.7rem;
      border: 0;
      border-radius: 999px;
      place-items: center;
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-toggle span {
      display: block;
      width: 1rem;
      height: 2px;
      margin: 0.18rem auto;
      border-radius: 999px;
      background: #ffffff;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    /* Hero Section */
    .messenger-hero {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5rem 1.5rem 6rem;
      min-height: 85vh;
      z-index: 10;
    }
    
    .messenger-card {
      position: relative;
      background: #ffffff;
      border-radius: 28px;
      padding: 5rem 3rem;
      max-width: 1150px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.03);
      z-index: 2;
    }
    
    .messenger-breadcrumb {
      position: relative;
      z-index: 10;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    
    .messenger-breadcrumb span {
      color: #1a7cf7;
    }
    
    .messenger-card h1 {
      position: relative;
      z-index: 10;
      font-size: clamp(2.5rem, 5vw, 3.8rem);
      line-height: 1.15;
      font-weight: 400;
      color: #0f172a;
      margin: 0 0 1.5rem;
    }
    
    .messenger-card h1 .blue-text {
      color: #1a7cf7;
    }
    
    .messenger-card p {
      position: relative;
      z-index: 10;
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      line-height: 1.6;
      color: #475569;
      max-width: 700px;
      margin: 0 auto 2.5rem;
    }
    
    .messenger-cta {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0062ff;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 1rem 2.5rem;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
      box-shadow: 0 10px 20px rgba(0, 98, 255, 0.2);
    }
    
    .messenger-cta:hover {
      background: #0056e0;
      transform: translateY(-2px);
    }
    
    /* Floating Icons */
    @keyframes float-bob {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    
    .floating-icon {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      pointer-events: none;
      animation: float-bob 6s ease-in-out infinite;
    }
    
    .floating-icon--top-right {
      animation-delay: 0s;
      top: -3rem;
      right: -4rem;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(200, 220, 255, 0.4) 30%, rgba(200, 220, 255, 0.1) 70%);
      border-radius: 50%;
    }
    
    .floating-icon--top-right::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    
    .floating-icon--bottom-left {
      animation-delay: -3s;
      bottom: -4rem;
      left: -5rem;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(200, 230, 255, 0.5) 30%, rgba(200, 230, 255, 0.1) 70%);
      border-radius: 50%;
    }
    
    .floating-icon--bottom-left::before {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    
    .floating-icon img {
      position: relative;
      width: 110px;
      height: 110px;
      z-index: 2;
    }
    
    @media (max-width: 768px) {
      .floating-icon {
        display: none;
      }
      .messenger-hero {
        padding: 4rem 1rem 4rem;
      }
      .messenger-card {
        padding: 3rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div data-site-header></div>

  <main>
    <section class="messenger-hero">
      <div class="messenger-card">
        
        <div class="floating-icon floating-icon--top-right">
          <!-- Added standard Messenger SVG for high fidelity matching -->
          <svg width="110" height="110" viewBox="0 0 100 100" style="position: relative; z-index: 2;" xmlns="http://www.w3.org/2000/svg">
            <path d="M50,10 C27.9,10 10,26.6 10,47 C10,58.6 16.1,68.9 25.4,75.4 L25.4,88.9 L35.2,83.6 C39.8,84.9 44.8,85.6 50,85.6 C72.1,85.6 90,69 90,48.6 C90,26.6 72.1,10 50,10 Z" fill="#0062ff"/>
            <path d="M54.1,61.4 L43.5,50.1 L23.6,61.4 L45.4,38.2 L56.1,49.5 L75.9,38.2 L54.1,61.4 Z" fill="#ffffff"/>
          </svg>
        </div>
        
        <div class="floating-icon floating-icon--bottom-left">
          <svg width="100" height="100" viewBox="0 0 100 100" style="position: relative; z-index: 2;" xmlns="http://www.w3.org/2000/svg">
            <path d="M50,10 C27.9,10 10,26.6 10,47 C10,58.6 16.1,68.9 25.4,75.4 L25.4,88.9 L35.2,83.6 C39.8,84.9 44.8,85.6 50,85.6 C72.1,85.6 90,69 90,48.6 C90,26.6 72.1,10 50,10 Z" fill="#0062ff"/>
            <path d="M54.1,61.4 L43.5,50.1 L23.6,61.4 L45.4,38.2 L56.1,49.5 L75.9,38.2 L54.1,61.4 Z" fill="#ffffff"/>
          </svg>
        </div>


        <h1>Scale lead generation on <span class="blue-text">Facebook</span> with AI agents</h1>
        
        <p>Connect your Facebook Messenger with Connektly to engage customers instantly, automate responses, and drive conversions at scale.</p>
        
        <a href="https://app.connektly.in/signup" class="messenger-cta">Start for Free</a>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="../../components/global.js"></script>
</body>
</html>
